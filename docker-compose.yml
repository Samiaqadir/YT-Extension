version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flow_sessions
    ports:
      - "5432:5432"
    volumes:
      - flow_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flow_sessions"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flow-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/flow_sessions
      JWT_SECRET: flow-production-jwt-delegation-secret-key-2025
      GATEWAY_PUBLIC_URL: http://localhost:4000
      FRONTEND_PORTAL_URL: http://localhost:4000/portal
      USE_SQLITE_FALLBACK: "false"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  flow_pgdata:
