services:
  - type: web
    name: flow-session-gateway
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_SQLITE_FALLBACK
        value: "true"
      - key: JWT_SECRET
        generateValue: true
